appId: com.rzenterprises.crm
productName: RZ Enterprises CRM
npmRebuild: false
directories:
  output: release-dist
  buildResources: build
files:
  - dist/**/*
  - node_modules/**/*
  - package.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
